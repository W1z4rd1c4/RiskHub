name: Startup Smoke PR

on:
  pull_request:
    branches: [main, develop, "feat/identity-group-*"]

permissions:
  contents: read

jobs:
  docker-onboarding-smoke:
    name: Docker Onboarding Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run Docker onboarding smoke
        uses: ./.github/actions/docker-onboarding-smoke
        with:
          artifact-name: startup-smoke-pr
