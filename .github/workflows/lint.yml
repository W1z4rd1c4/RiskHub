name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, "feat/identity-group-*"]

permissions:
  contents: read

jobs:
  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        id: frontend-install
        run: npm ci
        working-directory: frontend

      # Run each new gate independently after installation so the first CI run
      # exposes all existing test debt without suppressions or a fabricated baseline.
      - name: Verify frontend test tooling scope
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' }}
        run: npm run quality:test-tooling
        working-directory: frontend

      - name: Lint centralized frontend tests and harnesses
        id: test-lint
        # The complete strict test program exceeds Node’s default 2 GiB heap.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' }}
        run: |
          set -euo pipefail
          npm run lint:tests 2>&1 | tee ../lint-frontend-tests.log
        working-directory: frontend

      - name: Typecheck centralized frontend tests and harnesses
        id: test-typecheck
        # The complete strict test program exceeds Node’s default 2 GiB heap.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' }}
        run: |
          set -euo pipefail
          npm run typecheck:tests 2>&1 | tee ../lint-frontend-test-types.log
        working-directory: frontend

      - name: Run frontend Vitest coverage gate
        id: test-coverage
        if: ${{ !cancelled() && steps.frontend-install.outcome == 'success' }}
        run: |
          set -euo pipefail
          npm run test:coverage 2>&1 | tee ../frontend-coverage.log
        working-directory: frontend

      - name: Summarize frontend test evidence
        if: always()
        env:
          TEST_LINT_OUTCOME: ${{ steps.test-lint.outcome }}
          TEST_TYPES_OUTCOME: ${{ steps.test-typecheck.outcome }}
          TEST_COVERAGE_OUTCOME: ${{ steps.test-coverage.outcome }}
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          console.log('## Frontend test quality');
          console.log(`- Centralized test lint: ${process.env.TEST_LINT_OUTCOME}`);
          console.log(`- Centralized test types: ${process.env.TEST_TYPES_OUTCOME}`);
          console.log(`- Full-source coverage gate: ${process.env.TEST_COVERAGE_OUTCOME}`);
          const file = 'tests/results/frontend/unit/coverage/coverage-summary.json';
          if (fs.existsSync(file)) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(`- Executable source files in coverage report: ${Object.keys(report).filter(key => key !== 'total').length}`);
            for (const metric of ['statements', 'branches', 'functions', 'lines']) {
              const value = report.total[metric];
              console.log(`- ${metric}: ${value.covered}/${value.total} (${value.pct}%)`);
            }
            console.log('Observed CI measurements only. A failing run is not an accepted baseline; floors remain 57/47/47/58.');
          } else {
            console.log('- Coverage report unavailable; no baseline measurement was established.');
          }
          JS

      - name: Upload frontend test quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-quality-evidence
          path: |
            lint-frontend-tests.log
            lint-frontend-test-types.log
            frontend-coverage.log
            tests/results/frontend/unit/coverage/
          retention-days: 30

  pr-merge-result-build:
    name: PR Merge Result Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify synthetic merge result checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build synthetic merge result
        run: npm run build
        working-directory: frontend

  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt
            backend/requirements-db.txt
            backend/requirements-dev.txt

      - name: Install backend lint dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
        working-directory: backend

      - name: Backend Ruff gate
        run: |
          set -euo pipefail
          cd backend
          ruff check --config ruff.toml app ../tests/backend/pytest scripts | tee ../lint-backend-ruff.log

      - name: Backend mypy gate
        run: |
          set -euo pipefail
          cd backend
          mypy --config-file mypy.ini app | tee ../lint-backend-mypy.log

      - name: Backend suppression budget gate
        run: |
          set -euo pipefail
          python3 scripts/tools/suppression_budget.py | tee lint-backend-suppression-budget.log

      - name: Upload backend lint evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-backend-evidence
          path: |
            lint-backend-ruff.log
            lint-backend-mypy.log
            lint-backend-suppression-budget.log
            tests/results/quality/suppression-budget-*/suppression-budget.json
          retention-days: 30

  lint:
    name: Frontend + Repo Contracts
    runs-on: ubuntu-latest
    needs: [frontend-unit-tests]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # `npm run lint` includes app + centralized tests, then ADR-013 strict zero.
      # Every enabled recommended jsx-a11y rule is an error; any finding, non-empty
      # audit evidence, or suppression entry fails (FR-P1-4 · N4–N6).
      - name: Frontend lint (eslint + jsx-a11y strict zero)
        # This aggregate command also checks the full typed centralized suite.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          npm run lint | tee ../lint-frontend.log
        working-directory: frontend

      # G-RATCHET (audit 2026-09-30 §4.1, D15): per-file design-debt counts may only go down.
      - name: Frontend UI consistency ratchet
        run: |
          set -euo pipefail
          npm run quality:ui-ratchet | tee ../lint-frontend-ui-ratchet.log
        working-directory: frontend

      - name: Frontend typecheck
        run: |
          set -euo pipefail
          npm run typecheck | tee ../lint-frontend-typecheck.log
        working-directory: frontend

      - name: Frontend build
        run: |
          set -euo pipefail
          npm run build | tee ../lint-frontend-build.log
        working-directory: frontend

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt
            backend/requirements-db.txt
            backend/requirements-dev.txt

      - name: Install repo contract Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Repo artifact + script syntax contracts
        run: |
          set -euo pipefail
          AUTHZ_CONTRACT_BASE_REF=HEAD
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            AUTHZ_CONTRACT_BASE_REF="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            AUTHZ_CONTRACT_BASE_REF="${{ github.event.before }}"
          fi
          AUTHZ_CONTRACT_BASE_REF="$AUTHZ_CONTRACT_BASE_REF" make -f scripts/Makefile quality-repo-contracts | tee lint-repo-contracts.log

      - name: Production contract docs gate
        run: |
          set -euo pipefail
          python3 scripts/security/validate_production_contract_docs.py | tee lint-production-contract.log

      - name: Deprecated import contract
        run: |
          set -euo pipefail
          python3 scripts/security/validate_deprecated_imports.py | tee lint-deprecated-imports.log

      - name: Write lint summary
        run: |
          {
            echo "# Lint Summary";
            echo "";
            echo "- Frontend unit tests: PASS";
            echo "- Frontend lint (eslint + jsx-a11y strict zero): PASS";
            echo "- Frontend UI consistency ratchet: PASS";
            echo "- Frontend typecheck: PASS";
            echo "- Frontend build: PASS";
            echo "- Repo artifact + script syntax contracts: PASS";
            echo "- Production contract docs: PASS";
            echo "- Deprecated imports: PASS";
          } > lint-summary.md

      - name: Upload lint evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-evidence
          path: |
            lint-summary.md
            lint-frontend.log
            lint-frontend-ui-ratchet.log
            lint-frontend-typecheck.log
            lint-frontend-build.log
            lint-repo-contracts.log
            lint-production-contract.log
            lint-deprecated-imports.log
          retention-days: 30
