name: Startup Smoke

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-onboarding-smoke:
    name: Docker Onboarding Smoke (Scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}

      - name: Run Docker onboarding smoke
        uses: ./.github/actions/docker-onboarding-smoke
        with:
          artifact-name: startup-smoke
