name: Backend Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, "feat/identity-group-*"]

permissions:
  contents: read

jobs:
  sqlite-tests:
    name: Backend SQLite Regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt
            backend/requirements-db.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run SQLite regression suite
        working-directory: backend
        run: pytest -m "not postgres and not benchmark" -q

  postgres-tests:
    name: Backend Postgres Regression
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15@sha256:c635fa3e3b7421a659d34abdfd6d492f679cbe8149e261a501237b55c5a94212
        env:
          POSTGRES_USER: riskhub
          POSTGRES_PASSWORD: riskhub_test
          POSTGRES_DB: riskhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt
            backend/requirements-db.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        id: backend-install
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Record Python tooling source and installed versions
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/python-tooling-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/python-tooling-evidence/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/python-tooling-evidence/tree.txt"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          sha256sum backend/requirements-dev.in backend/requirements-dev.txt backend/requirements-dev-constraints.txt backend/requirements-prod-readiness-audit-constraints.txt > "$RUNNER_TEMP/python-tooling-evidence/manifests.sha256"
          python -m pip freeze --all > "$RUNNER_TEMP/python-tooling-evidence/installed.txt"
          python - <<'PY' > "$RUNNER_TEMP/python-tooling-evidence/versions.json"
          import importlib.metadata
          import json
          import platform
          import sys

          packages = ["pip", "ruff", "mypy", "syrupy", "pytest", "pytest-postgresql", "filelock", "virtualenv"]
          print(json.dumps({
              "python": sys.version,
              "platform": platform.platform(),
              "packages": {name: importlib.metadata.version(name) for name in packages},
          }, indent=2))
          PY

      - name: Run blocking Postgres regression contract
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://riskhub:riskhub_test@localhost:5432/riskhub_test
        run: make -f scripts/Makefile test-postgres-ci

      - name: Run canonical UUID4 and governed Process identity regressions
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://riskhub:riskhub_test@localhost:5432/riskhub_test
        run: >-
          pytest -q --strict-markers --no-cov
          ../tests/backend/pytest/test_canonical_uuid4_sql.py
          ../tests/backend/pytest/test_governed_process_identity.py

      - name: Run governed mutation apply HTTP regressions
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://riskhub:riskhub_test@localhost:5432/riskhub_test
        run: >-
          pytest -q --strict-markers --no-cov
          ../tests/backend/pytest/test_vendor_edit_apply.py
          ../tests/backend/pytest/test_asset_apply.py
          ../tests/backend/pytest/test_process_apply.py
          ../tests/backend/pytest/test_governed_asset_mixed_policy.py

      - name: Run PostgreSQL plugin and Python tooling compatibility probes
        if: ${{ !cancelled() && steps.backend-install.outcome == 'success' }}
        env:
          RISKHUB_TOOLING_PROBE_POSTGRES: '1'
          PGPASSWORD: riskhub_test
        run: |
          set -euo pipefail
          python -m pip check 2>&1 | tee "$RUNNER_TEMP/python-tooling-evidence/pip-check.log"
          python -m pytest -c backend/pytest.ini scripts/tools/probe_python_tooling.py -o addopts='' \
            --postgresql-host=127.0.0.1 --postgresql-port=5432 --postgresql-user=riskhub \
            --junitxml="$RUNNER_TEMP/python-tooling-evidence/probes.xml" -q \
            2>&1 | tee "$RUNNER_TEMP/python-tooling-evidence/probes.log"

      - name: Upload Python tooling compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-tooling-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/python-tooling-evidence/
          retention-days: 30
          if-no-files-found: error
