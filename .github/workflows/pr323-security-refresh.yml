name: Refresh PR 323 OpenTelemetry security pins
on:
  push:
    branches: ['automation/pr323-security-refresh-20261113']
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Resolve only the matching OpenTelemetry family
        run: |
          python scripts/tools/refresh_python_dependency_lock.py \
            --upgrade-package opentelemetry-api \
            --upgrade-package opentelemetry-sdk \
            --upgrade-package opentelemetry-exporter-http-transport \
            --upgrade-package opentelemetry-exporter-otlp-common \
            --upgrade-package opentelemetry-exporter-otlp-proto-common \
            --upgrade-package opentelemetry-exporter-otlp-proto-http \
            --upgrade-package opentelemetry-proto \
            --upgrade-package opentelemetry-semantic-conventions
      - name: Generate and verify deterministic Alpine locks
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --target builder-base -t riskhub-pr323-resolver -f backend/Dockerfile backend
          mkdir -p "$RUNNER_TEMP/pr323-locks"
          docker run --rm --platform linux/amd64 -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/pr323-locks:/out" -w /repo riskhub-pr323-resolver sh -ec '
            python -m pip install --force-reinstall --no-cache-dir --require-hashes --only-binary=:all: -r backend/requirements-lock-bootstrap.txt
            python scripts/tools/runtime_dependency_lock.py generate --lock-dir /out/candidate
            python scripts/tools/runtime_dependency_lock.py generate --lock-dir /out/repeat
            diff -r /out/candidate /out/repeat
            python scripts/tools/runtime_dependency_lock.py verify --lock-dir /out/candidate
          '
          cp "$RUNNER_TEMP/pr323-locks/candidate/"* backend/locks/cpython313-alpine324-x86_64/
          python -m pip install -r backend/requirements-dev.txt
          python scripts/tools/runtime_dependency_lock.py preflight
          python -m unittest discover -s scripts/tools/tests -p '*dependency_lock*.py' -v
      - name: Run the complete Python dependency security gate
        working-directory: backend
        run: python ../scripts/security/ci_health.py run-python-audit --workdir .
      - name: Export generated reviewable inputs
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          names = [
              "backend/requirements-dev-constraints.txt",
              "backend/requirements-prod-readiness-audit-constraints.txt",
              "backend/requirements-dev.txt",
              "backend/locks/cpython313-alpine324-x86_64/manifest.json",
              "backend/locks/cpython313-alpine324-x86_64/requirements-runtime.lock",
              "backend/locks/cpython313-alpine324-x86_64/requirements-dbtasks.lock",
              "backend/locks/cpython313-alpine324-x86_64/requirements-pip.lock",
          ]
          for name in names:
              content = pathlib.Path(name).read_text()
              digest = hashlib.sha256(content.encode()).hexdigest()
              for offset in range(0, len(content), 8000):
                  print("PR323_FILE_JSON " + json.dumps({"path": name, "offset": offset, "total": len(content), "sha256": digest, "text": content[offset:offset + 8000]}))
          PY
