name: Verify PR 323 security dependency fixes

on:
  push:
    branches: ['automation/pr323-security-refresh-20261113']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install the exact reviewed dependency graph
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify source, image and lock contracts
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/tools/tests -p test_runtime_dependency_lock.py -v
          python scripts/tools/runtime_dependency_lock.py preflight
          python scripts/tools/validate_contributor_command_contract.py
          python -m ruff check backend/security/strip_unused_sqlite.py backend/security/verify_runtime_security.py tests/backend/pytest/test_backend_container_security_contract.py
          PYTHONPATH=.:backend python -m pytest --noconftest -o addopts= -q \
            tests/backend/pytest/test_backend_container_security_contract.py \
            tests/backend/pytest/test_workflow_pin_validator.py \
            tests/backend/pytest/test_phase500_script_contracts.py \
            tests/backend/pytest/test_contributor_command_contract.py \
            tests/backend/pytest/test_linux_release_bundle_security.py \
            tests/backend/pytest/test_linux_release_lifecycle_security.py
          git diff --check
      - name: Verify the frontend dependency fix
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Build and scan both production images
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 python:3.13.18-alpine3.24@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          for lane in runtime dbtasks; do
            docker build --platform linux/amd64 --target "$lane" -t "riskhub-pr323:$lane" -f backend/Dockerfile backend
            docker run --rm --platform linux/amd64 --entrypoint python "riskhub-pr323:$lane" -c 'import bz2, ctypes, dbm.gnu, lzma, readline, ssl, uuid, zlib; import alembic, asyncpg; from sqlalchemy.dialects.postgresql import asyncpg as dialect; print("Preserved Python libraries and PostgreSQL imports")'
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              anchore/syft:v1.42.3@sha256:5999d209a342e55e9edf70bf8930fb5b86d8f2a783fa401178372c50e21b1d36 \
              "riskhub-pr323:$lane" -o json > "$RUNNER_TEMP/sbom-$lane.json"
            docker run --rm -v "$RUNNER_TEMP:/data:ro" \
              anchore/grype:v0.110.0@sha256:af65fbc0c664691067788fe95ff88760b435543e45595eb2ca6f102fc476fbe1 \
              "sbom:/data/sbom-$lane.json" --fail-on high -o json > "$RUNNER_TEMP/grype-$lane.json"
          done
          python - <<'PY'
          import json, os, pathlib
          for lane in ("runtime", "dbtasks"):
              data = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / f"grype-{lane}.json").read_text())
              findings = [m for m in data["matches"] if m["vulnerability"]["severity"].lower() in {"high", "critical"}]
              assert not findings, findings
              print(f"PR323_SCAN {lane}: zero HIGH/CRITICAL findings")
          PY
