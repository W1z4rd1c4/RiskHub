# Shared by every context that defines its own add_header directives.
# Security Headers
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# HSTS - Force HTTPS (only effective when served over HTTPS)
# max-age=31536000 = 1 year, includeSubDomains ensures all subdomains use HTTPS
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Content Security Policy (tightened for the static frontend container).
# - script-src: no 'unsafe-inline' / 'unsafe-eval'
# - connect-src: restricted to same-origin and backend only
# Do not include CSP HTTPS-upgrade here: the Docker demo/test surface
# is served on plain HTTP and WebKit upgrades relative assets to HTTPS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https: blob:; connect-src 'self' https://login.microsoftonline.com; frame-src 'self' https://login.microsoftonline.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none';" always;
