# Grype suppressions for RiskHub container scanning.
# Keep this list minimal and time-bound.
#
# Required fields for each suppression entry:
# - vulnerability: CVE identifier
# - reason: why accepted, including Owner, Decision, Scanner evidence, No-fix proof,
#   Reachability, and Exit
# - expires-on: YYYY-MM-DD
# - package.name: affected package
# - package.version: affected version (or range rationale in reason)
# - namespace, fix-state, and match-type: exact vulnerability-match selectors
# - package.type, package.location, and package.upstream-name: exact scanner artifact selectors
#
# Example:
# ignore:
#   - vulnerability: CVE-2099-0001
#     reason: "Owner: Platform. Decision: temporary acceptance. Scanner evidence: Grype reports the exact affected package. No-fix proof: upstream has not released a fixed version. Reachability: the vulnerable path is not used. Exit: upgrade the affected package and remove this rule."
#     namespace: nvd:cpe
#     fix-state: unknown
#     match-type: cpe-match
#     expires-on: 2026-09-30
#     package:
#       name: python
#       version: 3.13.0
#       type: binary
#       location: /usr/local/bin/python3.13
#       upstream-name: python

ignore:
  - vulnerability: CVE-2026-14456
    reason: "Owner: Platform / W1z4rd1c4. Decision: time-bound acceptance for the OpenSSL QUIC server pending-channel memory-exhaustion finding. Scanner evidence: Grype v0.110.0 reports one High nvd:cpe cpe-match for libcrypto3 3.5.7-r0 at /lib/apk/db/installed, upstream package openssl, with unknown fix state. No-fix proof: the OpenSSL security advisory of 2026-08-13 says 3.5 users should upgrade to 3.5.8 once released and that no new release is being issued at this time. Reachability: RiskHub has no QUIC listener, HTTP/3, aioquic, SSL_accept, or OpenSSL QUIC API use in backend application code, scripts, or requirements. Exit: upgrade to an Alpine package containing OpenSSL 3.5.8 or the authoritative backport, rebuild and scan, then remove this rule."
    namespace: nvd:cpe
    fix-state: unknown
    match-type: cpe-match
    expires-on: 2026-09-30
    package:
      name: libcrypto3
      version: 3.5.7-r0
      type: apk
      location: /lib/apk/db/installed
      upstream-name: openssl
  - vulnerability: CVE-2026-14456
    reason: "Owner: Platform / W1z4rd1c4. Decision: time-bound acceptance for the OpenSSL QUIC server pending-channel memory-exhaustion finding. Scanner evidence: Grype v0.110.0 reports one High nvd:cpe cpe-match for libssl3 3.5.7-r0 at /lib/apk/db/installed, upstream package openssl, with unknown fix state. No-fix proof: the OpenSSL security advisory of 2026-08-13 says 3.5 users should upgrade to 3.5.8 once released and that no new release is being issued at this time. Reachability: RiskHub has no QUIC listener, HTTP/3, aioquic, SSL_accept, or OpenSSL QUIC API use in backend application code, scripts, or requirements. Exit: upgrade to an Alpine package containing OpenSSL 3.5.8 or the authoritative backport, rebuild and scan, then remove this rule."
    namespace: nvd:cpe
    fix-state: unknown
    match-type: cpe-match
    expires-on: 2026-09-30
    package:
      name: libssl3
      version: 3.5.7-r0
      type: apk
      location: /lib/apk/db/installed
      upstream-name: openssl
